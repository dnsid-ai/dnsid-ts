name: Compliance
on: pull_request
permissions:
  contents: read
  issues: write
jobs:
  compliance:
    # The private compliance harness is not available to fork pull requests.
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: dnsid-ai/dnsid-sdk-compliance/.github/workflows/sdk-compliance.yaml@939d24133ea020497957f0f550e895fe8d90f4e2
    with:
      sdk: ts
      ref: ${{ github.event.pull_request.head.sha }}
      base-ref: ${{ github.event.pull_request.base.sha }}
